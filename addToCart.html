<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
      <link rel="icon" href="/public/images/e-com.png" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce Web | Cart</title>
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="section-navbar">
          <!-- navbar bottom part -->
          <div class="container">

            <div class="navbar-brand">
              <a href="index.html"><h2>TradeX</h2></a>
            </div>
      
            <nav class="navbar">
              <ul>
                <li class="nav-item">
                  <a href="/" class="nav-link">Home</a>
                </li>
                <li class="nav-item">
                  <a href="products.html" class="nav-link">products</a>
                </li>
                <li class="nav-item">
                  <a href="about.html" class="nav-link">about</a>
                </li>
                <li class="nav-item">
                  <a href="contact.html" class="nav-link">contact</a>
                </li>
                <li class="nav-item">
                  <a href="cartToCart.html" class="nav-link add-to-cart-button" id="cartValue">
                    <i class="fa-solid fa-cart-shopping"> 0 </i>
                  </a>
                </li>
              </ul>
            </nav>
          </div>
        </header>
        <!-- headers section end -->

        <div class="popup-container">
          <!-- <section >
            <p>product added to the cart!</p>
          </section> -->
        </div>

        <section class="addToCartElement">
            <div class="container">
              <section>
                <div id="productCartContainer"></div>
              </section>
      
              <section class="productCartTotalElem">
                <div class="productCartTotalElement">
                  <p>Selected Offer Summary</p>
                  <div class="productOrderTotal">
                    <div>
                      <p>Sub Total:</p>
                      <p class="productSubTotal">0</p>
                    </div>
                    <div>
                      <p>Tax:</p>
                      <p class="productTax">$50</p>
                    </div>
                    <hr />
                    <div>
                      <p>Final Total:</p>
                      <p class="productFinalTotal">0</p>
                    </div>
                  </div>
                </div>
              </section>
            </div>
          </section>
      
          <!-- Template for a product -->
          <template id="productCartTemplate">
            <div class="cards" id="cardValue">
              <article class="information [ card ]">
                <div>
                  <span class="category"></span>
                </div>
                <div class="imageContainer">
                  <img class="productImage" src="" alt="" />
                </div>
      
                <h2 class="productName"></h2>
      
                <p class="cartProductPrice"></p>
      
                <div class="stockElement">
                    <button class="cartDecrement">-</button>
                    <p class="productQuantity"></p>
                    <button class="cartIncrement">+</button>
                </div>
      
                <!-- <button class="add-to-cart-button">Add To Cart</button> -->
                <button class="add-to-cart-button remove-to-cart-button">
                  Remove
                </button>
              </article>
            </div>
          </template>
      

        <!-- footer starts -->
        <footer class="section-footer">
        </footer>
        <!-- footer ends -->
        <script type="module" src="./components/showCart.js"></script>
        <script type= "module" src="./components/footer.js"></script>
</body>
</html>
